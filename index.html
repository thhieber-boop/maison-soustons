  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="accueil">
  <!-- L'en-tête (menu) et le pied de page sont construits par js/commun.js -->
  <header class="entete" id="entete"></header>

  <main>
    <section class="accueil">
      <img id="photo-accueil" class="accueil-photo" alt="" fetchpriority="high">
      <div class="accueil-texte">
        <p class="surtitre" data-t="accueil.surtitre"></p>
        <h1 id="nom-maison"></h1>
        <p data-t="accueil.sousTitre"></p>
        <div class="boutons">
          <a id="bouton-reserver" class="bouton" data-t="accueil.bouton"></a>
          <a id="bouton-maison" class="bouton bouton-clair" data-t="accueil.boutonMaison"></a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="conteneur">
        <h2 data-t="accueil.titreAtouts"></h2>
        <ul class="atouts" id="atouts"></ul>
      </div>
    </section>

    <section class="section section-claire">
      <div class="conteneur">
        <h2 data-t="accueil.titrePhotos"></h2>
        <div class="bandeau-photos" id="bandeau-photos"></div>
        <a id="lien-photos" class="lien-fleche" data-t="accueil.voirPhotos"></a>
      </div>
    </section>
  </main>

  <footer class="pied" id="pied"></footer>

  <!-- 1. données  2. liste des photos  3. textes  4. code commun  5. code de cette page -->

  <script src="textes/nl.js?v=20261108c"></script>

  <script src="js/page-accueil.js?v=20261108c"></script>
