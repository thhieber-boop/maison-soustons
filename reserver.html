<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Villa des Vergnes</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261108c">
</head>
<body data-page="reserver">
  <!-- L'en-tête (menu) et le pied de page sont construits par js/commun.js -->
  <header class="entete" id="entete"></header>

  <main>
    <div class="bandeau-page">
      <h1 data-t="reserver.titre"></h1>
    </div>

    <section class="section en-tete-page">
      <div class="conteneur">
        <p class="intro" data-t="reserver.intro"></p>
        <p class="bandeau-essai" id="bandeau-essai" data-t="reserver.modeEssai" hidden></p>

        <div class="reservation">
          <!-- Calendrier -->
          <div class="calendrier-zone">
            <ul class="legende-calendrier" id="legende"></ul>
            <div class="mois-choix" id="mois-choix"></div>
            <div class="mois-nav">
              <button id="mois-prec" class="fleche" data-t-aria="reserver.moisPrecedent">‹</button>
              <h2 id="mois-titre"></h2>
              <button id="mois-suiv" class="fleche" data-t-aria="reserver.moisSuivant">›</button>
            </div>
            <div class="calendrier" id="calendrier"></div>
          </div>

          <!-- Récapitulatif et formulaire -->
          <aside class="recap" id="recap">
            <h2 data-t="reserver.titreRecap"></h2>
            <div id="recap-contenu"></div>
            <form id="formulaire" class="formulaire" hidden>
              <h3 data-t="reserver.titreFormulaire"></h3>
              <label><span data-t="reserver.nom"></span><input name="nom" required autocomplete="name"></label>
              <label><span data-t="reserver.email"></span><input name="email" type="email" required autocomplete="email"></label>
              <label><span data-t="reserver.telephone"></span><input name="telephone" type="tel" autocomplete="tel"></label>
              <div class="deux-champs">
                <label><span data-t="reserver.adultes"></span><input name="adultes" type="number" min="1" max="9" value="2" required></label>
                <label><span data-t="reserver.enfants"></span><input name="enfants" type="number" min="0" max="8" value="0"></label>
              </div>
              <div id="options-services"></div>
              <label><span data-t="reserver.message"></span><textarea name="message" rows="3"></textarea></label>
              <!-- Piège à robots : champ invisible qu'un humain ne remplit jamais -->
              <input name="site_web" class="piege" tabindex="-1" autocomplete="off" aria-hidden="true">
              <p class="erreur" id="erreur" hidden></p>
              <button class="bouton" type="submit" id="envoyer" data-t="reserver.envoyer"></button>
              <p class="note" data-t="reserver.note"></p>
            </form>
            <div id="merci" class="merci" hidden>
              <h3 data-t="reserver.merciTitre"></h3>
              <p id="merci-texte"></p>
              <button class="bouton bouton-contour-fonce" id="nouvelle-demande" data-t="reserver.nouvelleDemande"></button>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <footer class="pied" id="pied"></footer>

  <!-- 1. données  2. liste des photos  3. textes  4. code commun  5. code de cette page -->
  <script src="config.js?v=20261108c"></script>
  <script src="photos/liste-photos.js?v=20261108c"></script>
  <script src="textes/fr.js?v=20261108c"></script>
  <script src="textes/en.js?v=20261108c"></script>
  <script src="textes/de.js?v=20261108c"></script>
  <script src="textes/es.js?v=20261108c"></script>
  <script src="textes/nl.js?v=20261108c"></script>
  <script src="js/commun.js?v=20261108c"></script>
  <script src="js/reservations.js?v=20261108c"></script>
  <script src="js/page-reserver.js?v=20261108c"></script>
</body>
</html>
